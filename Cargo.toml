[package]
name = "argosy"
license = "Apache-2.0"
version = "0.0.1"
edition = "2024"
repository = "https://github.com/craft-build/argosy"
description = "Library and Binary for creating, consuming and using knowledge books for coding harnesses"

[dependencies]
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
snafu = "0.9"
yaml_serde = "0.10"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
flate2 = "1"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
sqlite-vec = { version = "0.1", optional = true }
fastembed = { version = "6", default-features = false, features = [
  "hf-hub-native-tls",
  "ort-download-binaries-native-tls",
], optional = true }
rmcp = { version = "3.1", default-features = false, features = [
  "server",
  "transport-io",
], optional = true }
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "io-util",
  "time",
  "sync",
], optional = true }

[features]
default = ["default-index", "mcp"]
default-index = [
  "dep:rusqlite",
  "dep:sqlite-vec",
  "dep:fastembed",
]
mcp = ["dep:rmcp", "dep:tokio"]

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
serde_json = "1"
rmcp = { version = "3.1", default-features = false, features = [
  "server",
  "client",
  "transport-io",
] }
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "io-util",
] }
