[package]
name = "argosy"
license = "Apache-2.0"
version = "0.0.1"
edition = "2024"
repository = "https://github.com/craft-build/argosy"
description = "Library and Binary for creating, consuming and using knowledge books for coding harnesses"

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
snafu = "0.8"
yaml_serde = "0.10"

# --- Distribution packaging deps (doc 08) -----------------------------------
# `sha2` is the conventional pure-Rust SHA-256: `DIST-6` needs a standard hash
# for the integrity sidecar and `bundle_content_hash` change detector.
sha2 = "0.10"
# `tar` streams the `TarGz` format without materializing a staging copy.
tar = "0.4"
# `flate2` (default rust_backend/miniz_oxide — pure Rust, no C toolchain)
# compresses the tar stream.
flate2 = "1"

# --- Optional `default-index` backend deps (doc 07) -------------------------
# `bundled` is the upstream-recommended pairing with sqlite-vec's static C
# build: one toolchain compiles both SQLite and the vec0 extension.
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
# Statically compiles and links sqlite-vec's C source; we register
# `sqlite3_vec_init` as an auto-extension ourselves.
sqlite-vec = { version = "0.1", optional = true }
# The `units.tags` column is a JSON array, filtered via `json_each`.
serde_json = { version = "1", optional = true }
# fastembed: local ONNX text embeddings. `version = "5"` pins the v5 API
# (`TextEmbedding::try_new` / `TextInitOptions`); 6.0 landed too recently to
# adopt blindly. Features are the minimal set for dense text embedding:
#  - `hf-hub-native-tls`: pulls `hf-hub`, the only path that fetches models
#    (argosy's sole tolerated network access — see `index::fastembed` docs).
#  - `ort-download-binaries-native-tls`: the ONNX runtime binary for `ort`.
# Everything else (`image-models`, candle/llm backends, GPU providers) is off
# to keep the dependency tree and compile time down.
fastembed = { version = "5", default-features = false, features = [
  "hf-hub-native-tls",
  "ort-download-binaries-native-tls",
], optional = true }

[features]
# The backend is on by default (doc 00 §3: the binary and MCP server run it);
# `cargo build --no-default-features` yields the dependency-free trait layer.
default = ["default-index"]
# The default vector-store/embedding backend (sqlite-vec + fastembed). The
# trait layer in `src/index` needs no dependencies; this feature carries the
# whole backend so library consumers with their own stack pay nothing.
default-index = [
  "dep:rusqlite",
  "dep:sqlite-vec",
  "dep:serde_json",
  "dep:fastembed",
]

[dev-dependencies]
tempfile = "3"
