[package]
name = "argosy"
license = "Apache-2.0"
version = "0.0.1"
edition = "2024"
repository = "https://github.com/craft-build/argosy"
description = "Library and Binary for creating, consuming and using knowledge books for coding harnesses"

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
snafu = "0.8"
yaml_serde = "0.10"

[features]
# The default vector-store/embedding backend (sqlite-vec + fastembed). The
# trait layer in `src/index` needs no dependencies; the concrete backend's
# dependencies land here in a later chunk.
default-index = []

[dev-dependencies]
tempfile = "3"
