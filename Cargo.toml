[package]
name = "argosy"
version = "0.3.1"
edition = "2024"
description = "Library and Binary for creating, consuming and using knowledge books for coding harnesses"
repository = "https://github.com/craft-build/argosy"
license = "Apache-2.0"

[dependencies]
ast-grep-core = { version = "0.45", default-features = false, optional = true }
barkml = "0.10"
ast-grep-language = {
  version = "0.45",
  default-features = false,
  features = [
    "builtin-parser",
  ],
  optional = true
}
cfg-if = "1.0.5"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hf-hub = {
  version = "1.0",
  default-features = false,
  features = [
    "blocking",
    "rustls-tls",
  ],
  optional = true
}
ignore = { version = "0.4", optional = true }
ndarray = "0.17"
regex = {
  version = "1",
  default-features = false,
  features = [
    "perf",
    "std",
    "unicode-perl",
  ],
  optional = true
}
rmcp = {
  version = "3.4",
  default-features = false,
  features = [
    "server",
    "transport-io",
  ],
  optional = true
}
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
similar = { version = "3", features = ["inline", "unicode"], optional = true }
snafu = "0.9"
sqlite-vec = { version = "0.1", optional = true }
tar = "0.4"
tokenizers = {
  version = "0.23",
  default-features = false,
  features = [
    "fancy-regex",
  ],
  optional = true
}
tokio = {
  version = "1",
  default-features = false,
  features = [
    "io-util",
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
  ],
  optional = true
}
tracing = { version = "0.1", default-features = false, optional = true }
tract = { version = "0.23", optional = true }
tract-linalg = { version = "0.23", optional = true, features = [
    "multithread-mm"
]}
tree-sitter = { version = "0.26", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25.0", optional = true }
tree-sitter-dart = { version = "0.2", optional = true }
tree-sitter-elixir = { version = "0.3", optional = true }
tree-sitter-fish = { version = "3.6.0", optional = true }
tree-sitter-gdscript = { version = "6.1.0", optional = true }
tree-sitter-gdshader = { version = "0.4.0", optional = true }
tree-sitter-gleam = { version = "1.0", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-godot-resource = { version = "0.7.0", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
tree-sitter-lua = { version = "0.5", optional = true }
tree-sitter-md = { version = "0.5", optional = true }
tree-sitter-nix = { version = "0.3", optional = true }
tree-sitter-objc = { version = "3.0.2", optional = true }
tree-sitter-perl = { version = "1.1.2", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-scala = { version = "0.26", optional = true }
tree-sitter-sequel = { version = "0.3", optional = true }
tree-sitter-starlark = { version = "1.3", optional = true }
tree-sitter-svelte-next = { version = "0.1.1", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-yaml = { version = "0.7.2", optional = true }
tree-sitter-zig = { version = "1.1", optional = true }
tree-sitter-zsh = { version = "0.63.4", optional = true }
yaml_serde = "0.10"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
rmcp = {
  version = "3.4",
  default-features = false,
  features = [
    "client",
    "server",
    "transport-io",
  ]
}
serde_json = "1"
tempfile = "3"
test-case = "3"
tokio = {
  version = "1",
  default-features = false,
  features = [
    "io-util",
    "macros",
    "rt-multi-thread",
  ]
}

[features]
default = ["code-tools", "default-index", "mcp"]
code-tools = [
  "dep:ast-grep-core",
  "dep:ast-grep-language",
  "dep:ignore",
  "dep:regex",
  "dep:similar",
  "dep:tracing",
  "dep:tree-sitter",
  "dep:tree-sitter-bash",
  "dep:tree-sitter-c",
  "dep:tree-sitter-c-sharp",
  "dep:tree-sitter-cpp",
  "dep:tree-sitter-css",
  "dep:tree-sitter-dart",
  "dep:tree-sitter-elixir",
  "dep:tree-sitter-fish",
  "dep:tree-sitter-gdscript",
  "dep:tree-sitter-gdshader",
  "dep:tree-sitter-gleam",
  "dep:tree-sitter-go",
  "dep:tree-sitter-godot-resource",
  "dep:tree-sitter-html",
  "dep:tree-sitter-java",
  "dep:tree-sitter-kotlin-ng",
  "dep:tree-sitter-lua",
  "dep:tree-sitter-md",
  "dep:tree-sitter-nix",
  "dep:tree-sitter-objc",
  "dep:tree-sitter-perl",
  "dep:tree-sitter-php",
  "dep:tree-sitter-python",
  "dep:tree-sitter-ruby",
  "dep:tree-sitter-rust",
  "dep:tree-sitter-scala",
  "dep:tree-sitter-sequel",
  "dep:tree-sitter-starlark",
  "dep:tree-sitter-svelte-next",
  "dep:tree-sitter-swift",
  "dep:tree-sitter-toml-ng",
  "dep:tree-sitter-typescript",
  "dep:tree-sitter-yaml",
  "dep:tree-sitter-zig",
  "dep:tree-sitter-zsh",
]
default-index = [
  "dep:hf-hub",
  "dep:rusqlite",
  "dep:sqlite-vec",
  "dep:tokenizers",
  "dep:tract",
  "dep:tract-linalg",
]
mcp = ["dep:rmcp", "dep:tokio"]
